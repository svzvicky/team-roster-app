services:
  postgres:
    image: postgres:15
    container_name: roster-postgres
    restart: always
    environment:
      POSTGRES_DB: rosterdb
      POSTGRES_USER: roster_user
      POSTGRES_PASSWORD: roster_pass
    ports:
      - "5432:5432"
    volumes:
      - ./postgres-data:/var/lib/postgresql/data

  pgadmin:
    image: dpage/pgadmin4
    container_name: roster-pgadmin
    restart: always
    environment:
      PGADMIN_DEFAULT_EMAIL: admin@roster.com
      PGADMIN_DEFAULT_PASSWORD: admin
    ports:
      - "5050:80"
    depends_on:
      - postgres